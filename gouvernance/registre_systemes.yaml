# Registre des systèmes d'IA (politique G.5 v1.2, § 5) — copie de travail lue par la plateforme (G-03).
# Les versions courantes de SI-01 et SI-08 sont mises à jour automatiquement à chaque adoption (D13) ;
# l'historique est conservé dans donnees/adoptions_modeles.json.

systemes:
  SI-01:
    nom: "Claude par l'API d'Anthropic (familles Opus et Sonnet)"
    fournisseur: F-01
    usage: "Propositions de texte, analyse, conseiller, gestes nommés ; données NON sensibles seulement (D03)"
    risque: modere
    mesures: "Aiguillage D03 ; plafond de jetons ; version consignée par génération"
    version_courante: claude-opus-5-5 ; claude-sonnet-5-5
  SI-02:
    nom: "Modèle ouvert local servi par LM Studio (Ollama possible par configuration)"
    fournisseur: F-09
    usage: "Consignes et matériaux sensibles ; codage local des entretiens"
    risque: modere
    mesures: "verifier_local (aucun serveur hors de cette machine, aucune étiquette cloud ou remote, entrées remote_* ou device non local refusées) ; refus sans repli distant"
    version_courante: "luciole-8b-instruct-1.1 (LM Studio, GGUF Q4_K_M d'OpenLLM-France ; désigné le 2026-10-16, évaluation à l'aveugle du 2026-10-12, n = 131)"
    secours: "apertus-8b-instruct-2509-si02 (LM Studio ; le fichier même de l'évaluation à l'aveugle : GGUF bartowski Q4_K_M, poids identiques au téléchargement du 2026-10-17 — empreinte des tenseurs 02b26279…df437f1 —, gabarit de conversation simplifié de config/apertus_2509_gabarit_simple.jinja ; stéréotype moyen 0,26 contre 0,09 : à surveiller)"
    changement_fournisseur: "2026-10-16 : Ollama (F-03) remplacé par LM Studio (F-09), Luciole 1.1 n'étant pas accessible par Ollama sur le poste ; mêmes contrôles D03"
    approbation: "Changement de fournisseur (LM Studio) et correction du contact main-visage du robot virtuel (v2.3.3) approuvés par S. Gagné le 2026-10-17"
    version_anterieure: "gemma4:12b (provisoire, essais seulement, jusqu'au 2026-10-16)"
  SI-03:
    nom: "whisper.cpp (MIT), transcription locale"
    fournisseur: F-04
    usage: "Transcription des entretiens"
    risque: eleve
    mesures: "Hors ligne ; audio détruit après vérification (G.6)"
  SI-04:
    nom: "P1 — Atelier dramaturgique"
    usage: "Cinq opérations, journal I-5"
    risque: modere
    mesures: "Verrou de mise en service (fiche P1.1, § 7)"
  SI-05:
    nom: "P2 — Scénographie robotique (bibliothèque fermée, pont scénique)"
    usage: "Gestes nommés, conduite"
    risque: eleve
    mesures: "Aucune commande motrice par l'IA ; statuts brouillon → valide ; observateur ; arrêt matériel"
  SI-06:
    nom: "P3 — Interface spectateur"
    usage: "Rétroaction émotionnelle anonyme"
    risque: faible
    mesures: "Aucune donnée individuelle ; seuil de diffusion de 5"
  SI-07:
    nom: "Régisseur IA de l'application Régie (appel à SI-01 ou SI-08)"
    usage: "Synthèses en lecture seule"
    risque: faible
    mesures: "Aucune écriture ; références vérifiées"
  SI-08:
    nom: "GPT-6 par l'API Responses d'OpenAI (familles Sol et Luna)"
    fournisseur: F-08
    usage: "Mêmes usages que SI-01, au choix du chercheur ; données NON sensibles seulement (D03)"
    risque: modere
    mesures: "Aiguillage D03 ; paramètres appliqués consignés (A-08) ; version consignée par génération"
    version_courante: gpt-6.1-sol ; gpt-6-luna
    statut: "Inscrit à la politique G.5 v1.2 (signée le 12 oct. 2026) ; fiche F-08 v1.0 établie le 12 oct. 2026 ; store=false à chaque appel ; GPT-6 Terra en attente de publication"
  SI-09:
    nom: "Grok par l'API de xAI (famille Grok 4.x, puis la plus récente publiée)"
    fournisseur: F-10
    usage: "Dialogue parlé et commandes du robot, du chien et du drone, au choix de l'opératrice ; données NON sensibles seulement (D03)"
    risque: modere
    mesures: "Aiguillage D03 avant le choix du moteur ; vocabulaire fermé et revalidation des actions ; validation humaine ; journal sans texte des échanges"
    version_courante: grok-4.7
    statut: "Ajouté au code le 2026-10-20 ; inscription à la politique G.5 et fiche fournisseur F-10 à établir avant tout usage avec des personnes participantes. Selon la FAQ entreprise de xAI, les entrées et sorties de l'API ne servent pas à l'entraînement et sont supprimées sous 30 jours ; ne pas adhérer aux programmes de crédits contre partage de données."
  SI-10:
    nom: "Gemini par l'API Gemini de Google (familles Argon et Flash)"
    fournisseur: F-11
    usage: "Mêmes usages que SI-09 ; données NON sensibles seulement (D03)"
    risque: modere
    mesures: "Aiguillage D03 ; clé d'un projet avec facturation SEULEMENT (services payants) ; paramètres appliqués consignés (température et top_p ignorés par Argon : écart consigné, A-08)"
    version_courante: gemini-4-argon ; gemini-3.8-flash
    statut: "Ajouté au code le 2026-10-20 ; inscription à la politique G.5 et fiche fournisseur F-11 à établir. Conditions additionnelles de l'API Gemini (maj. 2026-04-28) : services gratuits = échanges employés par Google et relus par des personnes, d'où l'interdiction du niveau gratuit ; services payants = pas d'emploi pour améliorer les produits, journalisation limitée dans le temps."

fournisseurs:
  F-01: Anthropic
  F-02: Pollen Robotics (Reachy Mini)
  F-03: "Ollama (fournisseur antérieur de SI-02 jusqu'au 2026-10-16 ; conservé comme option de configuration)"
  F-04: "Éditeurs des modèles candidats à SI-02 ; whisper.cpp"
  F-07: "Hiwonder (AiNex)"
  F-09: "LM Studio (Element Labs) — serveur local de SI-02 depuis le 2026-10-16 ; fiche fournisseur à établir"
  F-10: "xAI (Grok) — fiche fournisseur à établir"
  F-11: "Google (API Gemini, services payants) — fiche fournisseur à établir"
  F-08: "OpenAI — fiche v1.0 du 12 oct. 2026 (G5_Fiche_fournisseur_F-08_OpenAI_v1.0.docx)"
