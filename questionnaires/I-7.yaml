- id: D
  titre:
    fr: Provenance du texte
    en: Origin of the text
  enonces:
  - id: MC_part_systeme
    type: curseur
    min: 0
    max: 100
    unite: '%'
    fr: Selon vous, quelle part du texte entendu venait du système ?
    en: null
  - id: MC_savait
    type: choix
    valeurs:
    - oui
    - non
    - en_partie
    libelles:
      fr:
      - Oui
      - Non
      - En partie
      en:
      - 'Yes'
      - 'No'
      - Partly
    fr: Saviez-vous, pendant le spectacle, quelles répliques venaient du système ?
    en: null
- id: E
  titre:
    fr: Votre réponse à la présentation
    en: Your response to the performance
  echelle:
    min: 1
    max: 7
    fr:
    - Pas du tout d'accord
    - Tout à fait d'accord
    en:
    - Strongly disagree
    - Strongly agree
  enonces:
  - id: ES_1
    fr: La présentation m'a touché.
    en: null
  - id: ES_2
    fr: J'y ai trouvé de la beauté.
    en: null
  - id: ES_3
    fr: Elle m'a fait réfléchir.
    en: null
  - id: ES_ouverte
    type: texte
    facultatif: true
    fr: Si vous le souhaitez, dites-nous en quelques mots ce que vous retenez.
    en: null
    note: Formulation de la question ouverte à confirmer (T.1, § 8, partie E).
- id: F
  titre:
    fr: Profil (facultatif)
    en: Profile (optional)
  facultatif: true
  enonces:
  - id: PR_age
    type: choix
    valeurs:
    - '18_34'
    - '35_54'
    - 55_plus
    - nr
    libelles:
      fr:
      - 18 à 34 ans
      - 35 à 54 ans
      - 55 ans et plus
      - Préfère ne pas répondre
      en:
      - 18–34
      - 35–54
      - 55 and over
      - Prefer not to say
    fr: Tranche d'âge
    en: Age group
  - id: PR_langue_usage
    type: choix
    valeurs:
    - fr
    - en
    - autre
    - nr
    libelles:
      fr:
      - Français
      - Anglais
      - Autre
      - Préfère ne pas répondre
      en:
      - French
      - English
      - Other
      - Prefer not to say
    fr: Langue d'usage
    en: Language used most often
  - id: PR_frequentation
    type: choix
    valeurs: null
    fr: Fréquentation du théâtre
    en: null
    note: Modalités à préciser dans l'instrument (dictionnaire A2).
  - id: PR_usage_IA
    type: choix
    valeurs: null
    fr: Usage de l'IA générative
    en: null
    note: Modalités à préciser dans l'instrument (dictionnaire A2).
  - id: PR_besoin_access
    type: choix
    valeurs:
    - oui
    - non
    - nr
    libelles:
      fr:
      - Oui
      - Non
      - Préfère ne pas répondre
      en:
      - 'Yes'
      - 'No'
      - Prefer not to say
    fr: Avez-vous un besoin d'accessibilité ?
    en: Do you have an accessibility need?
