- id: B
  titre:
    fr: Votre rôle et celui du système
    en: Your role and the system's
  echelle:
    min: 1
    max: 7
    fr:
    - Pas du tout d'accord
    - Tout à fait d'accord
    en:
    - Strongly disagree
    - Strongly agree
  enonces:
  - id: B1
    fr: Le système a influencé la direction prise par la scène.
    en: The system influenced the direction the scene took.
  - id: B2
    fr: Les idées importantes de la scène venaient du système.
    en: The key ideas in the scene came from the system.
  - id: B3
    fr: J'ai eu le sentiment de diriger le travail du début à la fin.
    en: I felt I was directing the work from beginning to end.
  - id: B4
    fr: Je considère le texte final comme le mien.
    en: I consider the final text to be mine.
  - id: B5
    fr: Je signerais ce texte de mon seul nom.
    en: I would sign this text under my name alone.
  - id: B6
    fr: Je mentionnerais au public l'usage du système.
    en: I would tell the audience that the system was used.
  - id: B7
    fr: Ce qui a été produit a une valeur artistique réelle.
    en: What was produced has real artistic value.
  - id: B8
    fr: J'ai beaucoup transformé les propositions que j'ai retenues.
    en: I substantially transformed the proposals I kept.
  - id: B_ouverte
    type: texte
    fr: Décrivez en une phrase le rôle du système aujourd'hui.
    en: Describe in one sentence the system's role today.
