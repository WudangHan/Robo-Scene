# Exemple : pilote écrit en python, lancé comme programme externe (langage unifié sur stdin/stdout).
# Gabarit dans sdk/python/ ; remplacer le robot simulé de l'exemple par les appels au matériel.

[robot]
id = "externe-python"
nom = "Pilote python (exemple)"
pilote = "externe"
langage = "python"
actif = false

[connexion]
commande = ["python3", "sdk/python/exemple_simule.py"]

[propulsion]
active = true

[[articulations]]
nom = "base"
min = 10.0
max = 170.0
repos = 90.0
[[articulations]]
nom = "tete"
min = 30.0
max = 150.0
repos = 90.0
