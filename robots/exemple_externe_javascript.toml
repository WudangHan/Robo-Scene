# Exemple : pilote écrit en javascript, lancé comme programme externe (langage unifié sur stdin/stdout).
# Gabarit dans sdk/javascript/ ; remplacer le robot simulé de l'exemple par les appels au matériel.

[robot]
id = "externe-javascript"
nom = "Pilote javascript (exemple)"
pilote = "externe"
langage = "javascript"
actif = false

[connexion]
commande = ["node", "sdk/javascript/exemple_simule.mjs"]

[propulsion]
active = true

[[articulations]]
nom = "base"
min = 10.0
max = 170.0
repos = 90.0
[[articulations]]
nom = "tete"
min = 30.0
max = 150.0
repos = 90.0
