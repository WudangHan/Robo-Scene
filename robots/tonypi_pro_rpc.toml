# Hiwonder TonyPi Pro — liaison SANS INSTALLATION par le serveur JSON-RPC de Hiwonder (port 9030, service tonypi.service).
# Mêmes articulations, mêmes bornes, mêmes gestes et même bibliothèque que robots/tonypi_pro.toml (voir ses sources) ;
# limites de ce mode : mains (17, 18) refusées par le serveur, ni batterie, ni centrale inertielle, ni capteurs, ni voix.
# Profil inactif au démarrage : l'activer depuis la Console (« Activer un profil ») ; un seul des deux profils TonyPi
# doit être relié au robot à la fois.

[robot]
id = "tonypi-pro-rpc"
nom = "TonyPi Pro (JSON-RPC)"
pilote = "tonypi_rpc"
langage = "python"
simulation = true            # jusqu'au relevé servo par servo (sens, bornes) à réception du robot
actif = false
sequences = "tonypi-pro"
capacites = ["camera", "gestes_natifs"]
notes = "Bipède : l'arrêt fige les servos à leur position (jamais de coupure du couple) et interrompt le geste natif en cours ; la marche n'existe que par les gestes natifs de Hiwonder."
gestes_natifs = [
  "stand", "stand_slow", "wave", "bow", "chest", "twist", "squat", "left_hand", "right_hand", "lift_left_hand",
  "wing_chun", "left_uppercut", "right_uppercut", "left_shot_fast", "right_shot_fast", "left_kick", "right_kick",
  "stepping", "go_forward", "go_forward_one_step", "go_forward_one_small_step", "back", "back_one_step",
  "turn_left", "turn_right", "turn_left_small_step", "turn_right_small_step", "left_move", "right_move",
  "stand_up_front", "stand_up_back",
]
gestes_dynamiques = [
  "squat", "twist", "wing_chun", "left_shot_fast", "right_shot_fast", "left_kick", "right_kick", "stepping",
  "go_forward", "go_forward_one_step", "go_forward_one_small_step", "back", "back_one_step", "turn_left", "turn_right",
  "turn_left_small_step", "turn_right_small_step", "left_move", "right_move", "stand_up_front", "stand_up_back",
]

[libelles_gestes]
stand = "Debout"
stand_slow = "Debout (lent)"
wave = "Saluer de la main"
bow = "Révérence"
chest = "Célébrer"
twist = "Torsion du buste"
squat = "S'accroupir"
left_hand = "Lever la main gauche"
right_hand = "Lever la main droite"
lift_left_hand = "Montrer de la main gauche"
wing_chun = "Garde (wing chun)"
left_uppercut = "Crochet du gauche"
right_uppercut = "Crochet du droit"
left_shot_fast = "Frapper du pied gauche"
right_shot_fast = "Frapper du pied droit"
left_kick = "Coup de pied latéral gauche"
right_kick = "Coup de pied latéral droit"
stepping = "Marcher sur place"
go_forward = "Avancer"
go_forward_one_step = "Un pas en avant"
go_forward_one_small_step = "Un petit pas en avant"
back = "Reculer"
back_one_step = "Un pas en arrière"
turn_left = "Tourner à gauche"
turn_right = "Tourner à droite"
turn_left_small_step = "Petit virage à gauche"
turn_right_small_step = "Petit virage à droite"
left_move = "Pas chassé à gauche"
right_move = "Pas chassé à droite"
stand_up_front = "Se relever (tombé en avant)"
stand_up_back = "Se relever (tombé en arrière)"

[propulsion]
active = true                # la « propulsion » du TonyPi est sa marche : avancer, reculer, tourner (gestes natifs)

[connexion]
url = "http://192.168.149.1:9030"   # serveur JSON-RPC de Hiwonder
periode_lecture_s = 1.0

[camera]
mjpeg = "http://192.168.149.1:8080/?action=stream"   # serveur MJPEG du robot (Hiwonder ou pilote embarqué)

[securite]
vitesse_max_deg_s = 90.0
chien_de_garde_ms = 500
batterie_min_v = 10.0        # documentation Hiwonder : recharger sous 10 V (pleine charge 12,6 V)
rayon_exclusion_m = 1.0
propulsion_max = 1.0          # seuils de marche du pilote : 0,15 (arrêt) ; la vitesse reste celle des gestes natifs

# Correspondance avec le robot virtuel humanoïde (page « Robot virtuel ») : un axe du robot porte le nom d'un degré de
# liberté du robot virtuel ; `piloter` liste les axes que le robot virtuel peut commander (les jambes en sont exclues :
# l'équilibre d'un bipède relève des gestes natifs) ; tous les axes sont reflétés.
[jumeau]
piloter = ["tete.flexion", "tete.rotation", "epaule_g.flexion", "epaule_g.abduction", "coude_g.flexion",
           "epaule_d.flexion", "epaule_d.abduction", "coude_d.flexion", "main_g.fermeture", "main_d.fermeture"]

[[articulations]]
nom = "cheville_g.roulis"
id = 1
min = -25.2
max = 34.1
repos = 0.0
zero = 500
sens = 1
a_verifier = true   # sens à relever

