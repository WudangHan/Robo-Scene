[pytest]
# Une seule intégration continue pour la console, le partenaire et les prototypes P1, P2, P3 (phase 0 du plan d'action).
testpaths = tests modules
python_files = test_*.py
pythonpath = . modules/p1 modules/p2 modules/p3 modules/t6 modules/x2
addopts = --import-mode=importlib -q
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
